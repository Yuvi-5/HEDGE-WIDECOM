[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hedge-widecom"
version = "1.0.0"
description = "HEDGE-C: trimmed two-stage edge-computing pricing mechanism, WIDECOM 2026 reproduction package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "loguru>=0.7.2",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
    "edge_sim_py @ git+https://github.com/EdgeSimPy/EdgeSimPy.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]
